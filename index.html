<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>どうぶつ あずかりショップ</title>
<meta name="theme-color" content="#2b6f8f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #2b6f8f; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  #game { width: 100%; height: 100%; }
  /* おとなの設定（HTML で重ねる） */
  #parent { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); overflow: auto; z-index: 10; font-family: "M PLUS Rounded 1c", "Noto Sans JP", sans-serif; touch-action: auto; user-select: text; }
  .p-card { background: #fffaf2; color: #4a2c17; max-width: 760px; margin: 24px auto; padding: 16px 24px 24px; border-radius: 24px; }
  .p-card h2 { margin: 8px 0 12px; }
  .p-card h3 { margin: 18px 0 8px; font-size: 1.05rem; color: #a0522d; }
  .p-card label { display: flex; align-items: center; gap: 10px; margin: 8px 0; flex-wrap: wrap; }
  .p-card input, .p-card select { font: inherit; font-size: 1rem; padding: 8px 10px; border: 2px solid #e0c9a6; border-radius: 10px; min-width: 0; flex: 1 1 200px; }
  .p-card button { font: inherit; font-size: 1rem; padding: 10px 16px; border-radius: 12px; border: 0; background: #ffe2b8; color: #4a2c17; cursor: pointer; min-height: 44px; }
  .p-card button.danger { background: #e2553d; color: #fff; }
  .p-icons { display: flex; gap: 8px; flex-wrap: wrap; }
  .p-icons button { padding: 6px; background: #fff; border: 3px solid transparent; }
  .p-icons button.on { border-color: #ff7a59; }
  .p-icons img, .p-place img, .p-kids img { width: 44px; height: 44px; vertical-align: middle; }
  .p-check { gap: 8px; }
  .p-check input { flex: 0 0 auto; width: 24px; height: 24px; }
  .p-kids { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  .p-kids li { display: flex; align-items: center; gap: 10px; }
  .p-kids li button { margin-left: auto; }
  .p-left { margin: 8px 0; }
  .p-close { width: 100%; margin-top: 20px; background: #ff7a59 !important; color: #fff !important; font-size: 1.2rem !important; }
  .p-credit { font-size: .8rem; opacity: .7; margin-top: 16px; }
  .p-photo { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; }
  .p-note { font-size: .9rem; color: #7a6a5a; margin: 6px 0; }
</style>
</head>
<body>
<div id="game"></div>
<div id="parent" hidden></div>
<script src="vendor/phaser.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
